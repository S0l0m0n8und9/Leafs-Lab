name: Prepare unverified real-data candidate
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: leafs-lab-real-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - name: Download and structurally validate the unverified candidate
        run: python3 -m pipeline download --config config/moneypuck-real.json --raw-dir .refresh/raw --output .refresh/leafs-lab.json
      - name: Preserve candidate and original CSVs for semantic inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leafs-lab-real-candidate
          path: |
            .refresh/leafs-lab.json
            .refresh/raw/
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
    # Partial raw files remain inspectable when download or import fails.
    # No public/data replacement, git write, Site publication or refresh gate.
